<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Why QuadKit — four packages carry the framework</title>
  <desc id="desc">Four packages form the quad. quadkit-contracts defines the protocols and the Result model with zero runtime dependencies. quadkit is the core: a dependency-injection container, modules, typed config, logging and domain primitives. quadkit-web is the ASGI layer and quadkit-cli scaffolds and runs projects. Everything else is a reusable package that binds to the same contracts. All of them compose into your application.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17191c" stroke-width="1"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#aeb3b9"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#f4f5f6}
      .mono{font-family:'JetBrains Mono',monospace;letter-spacing:1.5px}
      .muted{fill:#9ba1a8}
      .faint{fill:#6e747b}
      .line{stroke:#5d636a}
      .box{fill:#101214;stroke:#555b62;stroke-width:1.5}
      .subbox{fill:#08090a;stroke:#393e44;stroke-width:1.2}
      .quad{fill:#0b1410;stroke:#2ddc91;stroke-width:1.5}
      .quadkick{fill:#2ddc91}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#050607"/><rect width="1200" height="760" fill="url(#grid)" opacity=".52"/>

  <text x="56" y="66" class="mono muted" font-size="14">ORIDECON LABS / QUADKIT</text>
  <text x="56" y="126" font-size="38" font-weight="650">Quad — four packages carry the framework.</text>
  <text x="56" y="161" class="muted" font-size="18">The rest is à la carte; every package binds to the same contracts.</text>
  <text x="1144" y="70" text-anchor="end" class="mono faint" font-size="13">ARCHITECTURE / 04</text>

  <rect x="280" y="196" width="640" height="64" class="subbox"/>
  <text x="600" y="234" text-anchor="middle" class="mono muted" font-size="14">YOUR APPLICATION</text>

  <rect x="220" y="300" width="232" height="132" class="quad"/>
  <text x="242" y="336" class="mono quadkick" font-size="13">02 / WEB</text>
  <text x="242" y="374" font-size="22" font-weight="650" fill="#2ddc91">quadkit-web</text>
  <text x="242" y="404" class="muted" font-size="14">Controllers · routing</text>
  <text x="242" y="424" class="muted" font-size="14">OpenAPI · websockets</text>

  <rect x="484" y="300" width="232" height="132" class="quad"/>
  <text x="506" y="336" class="mono quadkick" font-size="13">03 / CLI</text>
  <text x="506" y="374" font-size="22" font-weight="650" fill="#2ddc91">quadkit-cli</text>
  <text x="506" y="404" class="muted" font-size="14">Scaffold · generate</text>
  <text x="506" y="424" class="muted" font-size="14">one project tree</text>

  <rect x="748" y="300" width="232" height="132" class="box"/>
  <text x="770" y="336" class="mono muted" font-size="13">REUSABLE PACKAGES</text>
  <text x="770" y="362" class="faint" font-size="13">sql · cache · auth · events</text>
  <text x="770" y="384" class="faint" font-size="13">tasks · storage · http · monitor</text>
  <text x="770" y="406" class="faint" font-size="13">ai-llm · ai-agents · ai-mcp</text>
  <text x="770" y="428" class="faint" font-size="13">workflow · notification · testing</text>

  <rect x="220" y="470" width="760" height="96" class="quad"/>
  <text x="242" y="506" class="mono quadkick" font-size="13">01 / CORE</text>
  <text x="242" y="542" font-size="24" font-weight="650" fill="#2ddc91">quadkit</text>
  <text x="352" y="542" class="muted" font-size="16">DI container · modules · typed config · logging · domain primitives</text>

  <rect x="220" y="612" width="760" height="84" class="quad"/>
  <text x="242" y="644" class="mono quadkick" font-size="13">04 / CONTRACTS</text>
  <text x="242" y="678" font-size="22" font-weight="650" fill="#2ddc91">quadkit-contracts</text>
  <text x="446" y="678" class="muted" font-size="15">protocols · Result · zero runtime dependencies</text>

  <line x1="600" y1="612" x2="600" y2="570" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="336" y1="470" x2="336" y2="434" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="470" x2="600" y2="434" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="864" y1="470" x2="864" y2="434" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="336" y1="300" x2="336" y2="262" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="300" x2="600" y2="262" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="864" y1="300" x2="864" y2="262" class="line" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="56" y1="726" x2="1144" y2="726" stroke="#292d31"/>
  <text x="56" y="752" class="mono faint" font-size="12">FOUR PACKAGES, ONE FOUNDATION</text>
  <text x="1144" y="752" text-anchor="end" class="mono faint" font-size="12">ORIDECON LABS</text>
</svg>
