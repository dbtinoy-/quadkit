name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: dco-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dco:
    name: Check sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need both sides of the PR to enumerate its commits.
          fetch-depth: 0

      - name: Verify Developer Certificate of Origin
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "Not a pull request context; nothing to verify."
            exit 0
          fi

          # Only first-parent-new commits; merge commits are exempt because
          # they are generated, not authored.
          mapfile -t commits < <(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA")

          if [ "${#commits[@]}" -eq 0 ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          failed=0
          for sha in "${commits[@]}"; do
            author_name=$(git show -s --format='%an' "$sha")
            author_email=$(git show -s --format='%ae' "$sha")
            subject=$(git show -s --format='%s' "$sha")
            expected="Signed-off-by: ${author_name} <${author_email}>"

            # Compare against the trailer block, case-insensitively on the key.
            if git show -s --format='%B' "$sha" \
                 | grep -qiF "$expected"; then
              echo "ok       ${sha:0:8}  ${subject}"
            else
              echo "MISSING  ${sha:0:8}  ${subject}"
              echo "         expected trailer: ${expected}"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            cat <<'EOF'

          ------------------------------------------------------------------
          DCO check failed.

          Every commit must carry a Signed-off-by trailer matching its author,
          certifying the Developer Certificate of Origin (https://developercertificate.org/).

          To sign off future commits:

              git commit -s

          To fix the commits in this pull request:

              git rebase --signoff origin/main   # or the base branch
              git push --force-with-lease

          If the trailer is present but did not match, confirm that your
          git user.name and user.email are identical to the commit author.
          ------------------------------------------------------------------
          EOF
            exit 1
          fi

          echo "All ${#commits[@]} commit(s) signed off."
