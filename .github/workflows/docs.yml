name: Docs build

# The canonical documentation site is https://oridecon.dev/quadkit/. This
# workflow only verifies that the Markdown in docs/ still builds strictly,
# so a broken cross-reference fails the public repository instead of
# silently rotting. It does not deploy anywhere.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install the site toolchain
        run: pip install mkdocs-material==9.5.34
      - name: Build the site (strict, preview only)
        run: mkdocs build --strict --site-dir site
