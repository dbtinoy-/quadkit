name: Feature request
description: A capability you want in one of the public distributions
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, in your service's terms? Include the awkward code you have to write today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: Sketch of the API/behaviour you'd want. Alternatives you considered belong here too.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Would this change existing behaviour?
      options:
        - No — purely additive
        - Yes — changes a documented contract (goes through the RFC process)
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I checked the public roadmap (docs/governance/roadmap.md) — this is listed / not listed / contradicts it.
          required: false
        - label: If this changes a documented contract, I'll open an RFC instead (docs/governance/rfc-process.md).
          required: false
