# Generated by dev/release/export_public.py — do not edit by hand.
#
# This repository is an export of the Quadkit monorepo. Changes belong in
# the source repository; edits made here are overwritten by the next release.

[tool.uv.workspace]
members = [
    "core/quadkit",
    "core/quadkit-contracts",
    "packages/quadkit-cli",
    "packages/quadkit-testing",
    "packages/quadkit-web",
]

[tool.uv.sources]
quadkit = { workspace = true }
quadkit-cli = { workspace = true }
quadkit-contracts = { workspace = true }
quadkit-testing = { workspace = true }
quadkit-web = { workspace = true }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
addopts = ["--strict-markers", "--strict-config", "--tb=short",
           "--import-mode=importlib"]
consider_namespace_packages = true
markers = [
    "integration: marks tests as integration tests (excluded by default; opt in with '-m integration' or an integration path)",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "requires_redis: marks tests that require a live Redis connection",
    "requires_postgres: marks tests that require a live PostgreSQL connection",
    "requires_elasticsearch: marks tests that require a live Elasticsearch connection",
    "requires_meilisearch: marks tests that require a live Meilisearch connection",
    "requires_rabbitmq: marks tests that require a live RabbitMQ connection",
    "requires_smtp: marks tests that require an SMTP server",
    "requires_kafka: marks tests that require a live Kafka connection",
    "requires_minio: marks tests that require a live MinIO/S3 connection",
    "requires_mongodb: marks tests that require a live MongoDB connection",
    "requires_qdrant: marks tests that require a live Qdrant connection",
    "requires_neo4j: marks tests that require a live Neo4j connection",
    "scenario: marks cross-package scenario integration tests",
    "performance: mark test as a performance test",
]
testpaths = [
    "core/quadkit/tests",
    "core/quadkit-contracts/tests",
    "packages/quadkit-cli/tests",
    "packages/quadkit-testing/tests",
    "packages/quadkit-web/tests",
]
pythonpath = [
    "core/quadkit/src",
    "core/quadkit-contracts/src",
    "packages/quadkit-cli/src",
    "packages/quadkit-testing/src",
    "packages/quadkit-web/src",
]
