<!doctype html>
<html lang="en">
<head>
    <script>(function(){try{var t=localStorage.getItem("quadkit-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Change password · Auth Web</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="password">
<nav class="demo-nav">
  <a href="/" class="nav-brand">Quadkit</a>
  <span class="nav-demo">Auth Web</span>
  <div class="nav-links">
    <a href="https://oridecon.dev/quadkit" target="_blank" rel="noopener">Docs</a>
    <a href="https://github.com/dbtinoy-/quadkit" target="_blank" rel="noopener">GitHub</a>
  <button type="button" data-theme-toggle class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">🌙</button></div>
</nav>
<header>
  <h1>Change password</h1>
  <p class="muted">Update your credentials</p>
</header>
<main class="auth-shell">
<div class="auth-content">

  <div class="card">
    <p id="error" class="error"></p>
    <p id="ok" class="ok"></p>
    <form id="password-form">
      <label for="pw-current">Current password</label>
      <input id="pw-current" name="current_password" type="password" placeholder="current password" required />
      <label for="pw-new">New password</label>
      <input id="pw-new" name="new_password" type="password" placeholder="new password" required />
      <label for="pw-confirm">Confirm new password</label>
      <input id="pw-confirm" name="confirm_password" type="password" placeholder="confirm new password" required />
      <button type="submit">Update password</button>
    </form>
    <div class="auth-footer"><nav><a href="/profile">← Back to profile</a></nav></div>
  </div>
</div>
</main>

  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://oridecon.dev/quadkit" target="_blank" rel="noopener">Quadkit</a></div>
  <script>
    document.getElementById("password-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      showError("");
      showOk("");
      const submit = event.target.querySelector("button[type=submit]");
      submit.disabled = true;
      const form = new FormData(event.target);
      try {
        const result = await api("/api/profile/password", {
          method: "POST",
          body: JSON.stringify(Object.fromEntries(form)),
        });
        if (result.ok) {
          showOk("Password changed.");
          event.target.reset();
        } else {
          showError(result.body.error || result.body.detail || "Change failed");
        }
      } catch (error) {
        showError(error.message);
      } finally {
        submit.disabled = false;
      }
    });
  </script>
  <script src="/static/theme-toggle.js"></script>
</body>
</html>
