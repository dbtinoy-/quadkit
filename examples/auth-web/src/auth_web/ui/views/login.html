<!doctype html>
<html lang="en">
<head>
    <script>(function(){try{var t=localStorage.getItem("quadkit-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · Auth Web</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="login">
<nav class="demo-nav">
  <a href="/" class="nav-brand">Quadkit</a>
  <span class="nav-demo">Auth Web</span>
  <div class="nav-links">
    <a href="https://oridecon.dev/quadkit" target="_blank" rel="noopener">Docs</a>
    <a href="https://github.com/dbtinoy-/quadkit" target="_blank" rel="noopener">GitHub</a>
  <button type="button" data-theme-toggle class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">🌙</button></div>
</nav>
<header>
  <h1>Log in</h1>
  <p class="muted">Sign in to your account</p>
</header>
<main class="auth-shell">
<div class="auth-content">

  <div class="card">
    <p id="error" class="error"></p>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input id="login-email" name="email" type="email" placeholder="email" required />
      <label for="login-password">Password</label>
      <input id="login-password" name="password" type="password" placeholder="password" required />
      <button type="submit">Log in</button>
    </form>
    <div class="auth-footer"><p class="muted">Need an account? <a href="/register">Register</a></p></div>
  </div>

  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://oridecon.dev/quadkit" target="_blank" rel="noopener">Quadkit</a></div>
</div>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      showError("");
      const submit = event.target.querySelector("button[type=submit]");
      submit.disabled = true;
      const form = new FormData(event.target);
      try {
        const result = await api("/api/login", {
          method: "POST",
          body: JSON.stringify({
            email: form.get("email"),
            password: form.get("password"),
          }),
        });
        if (result.ok) {
          window.location.href = "/profile";
        } else {
          showError(result.body.error || result.body.detail || "Login failed");
        }
      } catch (error) {
        showError(error.message);
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</div>
</main>
  <script src="/static/theme-toggle.js"></script>
</body>
</html>
