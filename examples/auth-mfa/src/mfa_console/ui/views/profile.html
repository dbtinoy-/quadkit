<!doctype html>
<html lang="en">
<head>
    <script>(function(){try{var t=localStorage.getItem("quadkit-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8" />
  <title>Profile · Auth MFA</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body data-page="profile">
<nav class="demo-nav">
  <a href="/" class="nav-brand">Quadkit</a>
  <span class="nav-demo">Auth MFA</span>
  <div class="nav-links">
    <a href="https://oridecon.dev/quadkit" target="_blank" rel="noopener">Docs</a>
    <a href="https://github.com/dbtinoy-/quadkit" target="_blank" rel="noopener">GitHub</a>
  <button type="button" data-theme-toggle class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">🌙</button></div>
</nav>
<header>
  <h1>Profile</h1>
  <p class="muted">Manage two-factor authentication settings</p>
</header>
<main class="auth-shell">
<div class="auth-content">

    <div class="card" id="identity"><p class="muted">Loading…</p></div>
    <p id="error" class="error" role="alert"></p>

    <div class="card">
      <div class="card-header"><strong>Two-factor authentication</strong></div>
      <div class="row">
        <span id="mfa-state" class="chip"></span>
      </div>
      <div id="enroll-box" style="display:none">
        <p>Enable TOTP, then confirm with a code from your authenticator on next login.</p>
        <button type="button" id="enroll-btn">Enable TOTP</button>
      </div>
      <div id="enrolled-box" style="display:none">
        <p class="ok">MFA is enabled. Backup codes remaining: <b id="codes-left"></b></p>
        <form id="disable-form">
          <input name="password" type="password" placeholder="current password" required />
          <button type="submit" class="secondary">Disable MFA</button>
        </form>
      </div>
      <pre id="enroll-output" class="muted"></pre>
    </div>

    <nav><a href="/login" id="logout">Log out</a></nav>
</div>
</main>

  <script src="/static/app.js"></script>
  <script src="/static/mfa.js"></script>
  <div class="demo-footer">Powered by <a href="https://oridecon.dev/quadkit" target="_blank" rel="noopener">Quadkit</a></div>
  <script src="/static/theme-toggle.js"></script>
</body>
</html>
