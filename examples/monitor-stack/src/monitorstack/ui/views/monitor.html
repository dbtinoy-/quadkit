<!doctype html>
<html lang="en">
<head>
    <script>(function(){try{var t=localStorage.getItem("quadkit-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Monitor Stack · Quadkit</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="demo-nav">
  <a href="/" class="nav-brand">Quadkit</a>
  <span class="nav-demo">Monitor Stack</span>
  <div class="nav-links">
    <a href="https://oridecon.dev/quadkit" target="_blank" rel="noopener">Docs</a>
    <a href="https://github.com/dbtinoy-/quadkit" target="_blank" rel="noopener">GitHub</a>
  <button type="button" data-theme-toggle class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">🌙</button></div>
</nav>

  <header>
    <h1>Monitor Stack</h1>
    <p class="muted">Monitor Stack Demo — Demonstrates Quadkit monitoring pattern</p>
  </header>
  <main>
    <section id="health-panel">
      <h2>Health Status</h2>
      <div id="health-grid"></div>
    </section>

    <section id="metrics-panel">
      <h2>Metrics</h2>
      <div id="metrics-grid" aria-live="polite"></div>
    </section>

    <section id="trace-panel">
      <h2>Trace a request</h2>
      <form id="trace-form">
        <label for="trace-name">Span name</label>
        <div class="input-row">
          <input id="trace-name" type="text" value="demo.request" required>
          <button type="submit" id="trace-btn" class="accent">Record trace</button>
        </div>
      </form>
      <p id="trace-output" class="muted" aria-live="polite"></p>
      <p id="error" class="error hidden" role="alert"></p>
    </section>

    <section id="log-panel">
      <h2>Activity Log</h2>
      <div id="log"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://oridecon.dev/quadkit" target="_blank" rel="noopener">Quadkit</a></div>
  <script src="/static/theme-toggle.js"></script>
</body>
</html>
