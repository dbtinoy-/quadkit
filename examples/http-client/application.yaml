# ── HTTP Client ───────────────────────────────────────────────────────────────
# Demo-owned section bound to MinimalApiConfig via config_key="minimal_api";
# see the demo's config.py.
# Typed model: http_side.config.HttpSideConfig
# ─────────────────────────────────────────────────────────────────────────────
http_side:
  name: http_side
  enabled: true
  env: demo  # Deployment environment
  upstream_host: 127.0.0.1  # Loopback host the in-process mock upstream binds to
