<!doctype html>
<html lang="en">
<head>
    <script>(function(){try{var t=localStorage.getItem("quadkit-theme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="icon" href="/static/icon.png" type="image/png" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Task Manager · Quadkit</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="demo-nav">
  <a href="/" class="nav-brand">Quadkit</a>
  <span class="nav-demo">SQL Repository</span>
  <div class="nav-links">
    <a href="https://oridecon.dev/quadkit" target="_blank" rel="noopener">Docs</a>
    <a href="https://github.com/dbtinoy-/quadkit" target="_blank" rel="noopener">GitHub</a>
  <button type="button" data-theme-toggle class="theme-toggle" aria-label="Toggle dark mode" aria-pressed="false">🌙</button></div>
</nav>

  <header>
    <h1>Task Manager</h1>
    <p class="muted">SQL Repository — parameterized CRUD over Quadkit DatabaseModule and SQLite</p>
  </header>
  <main>
    <section id="task-panel">
      <h2>Tasks</h2>
      <form id="task-form">
        <label for="task-title">New task</label>
        <div class="input-row">
          <input id="task-title" type="text" placeholder="Try a repository insert" required>
          <button type="submit" id="create-task" class="accent">Create task</button>
        </div>
      </form>
      <p id="task-stats" class="muted" aria-live="polite"></p>
      <div id="tasks-list" aria-live="polite"></div>
    </section>

    <section id="log-panel">
      <h2>Activity Log</h2>
      <div id="log"></div>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <div class="demo-footer">Powered by <a href="https://oridecon.dev/quadkit" target="_blank" rel="noopener">Quadkit</a></div>
  <script src="/static/theme-toggle.js"></script>
</body>
</html>
