  #     primary: true
  #     type: redis
  #     redis_url: "redis://localhost:6379/0"
  #     queue_name: "quadkit_tasks"
  #   - name: notifications
  #     type: rabbitmq
  #     amqp_url: "amqp://guest:guest@localhost:5672//"
  #     queue_name: "quadkit_notifications"
