[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "quadkit-ai-mcp"
version = "0.0.50"
description = "MCP Server for Quadkit Framework - Model Context Protocol server for AI agents"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "ai",
    "mcp",
    "model-context-protocol",
    "llm",
    "agents",
    "framework",
    "async",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "quadkit>=0.0.2",
    "quadkit-contracts>=0.0.2",
    "typing-extensions>=4.0.0",
    "typer>=0.9.0",
    "jinja2>=3.1.0,<4",
]
authors = [
    { name = "Quadkit Framework Team", email = "team@quadkit.dev" },
]
maintainers = [
    { name = "Quadkit Framework Team", email = "team@quadkit.dev" },
]

[project.license]
text = "Apache-2.0"

[project.urls]
Homepage = "https://dbtinoy-.github.io/quadkit"
Repository = "https://github.com/dbtinoy-/quadkit"
Documentation = "https://dbtinoy-.github.io/quadkit"
Issues = "https://github.com/dbtinoy-/quadkit/issues"
Changelog = "https://github.com/dbtinoy-/quadkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "quadkit-testing>=0.0.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]

[project.entry-points."quadkit.providers"]
ai-mcp = "quadkit.ai.mcp.di.provider:MCPProvider"

[project.entry-points."quadkit.ai.subsystems"]
mcp = "quadkit.ai.mcp.di.provider:MCPProvider"

[project.entry-points."quadkit.ai.modules"]
mcp = "quadkit.ai.mcp.module:MCPModule"

[project.entry-points."quadkit.config"]
ai-mcp = "quadkit.ai.mcp.config:MCPConfig"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]
test = [
    "quadkit-testing>=0.0.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["quadkit"]
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
disable_error_code = ["attr-defined", "unused-ignore", "unreachable", "no-untyped-def", "type-arg", "misc", "arg-type", "assignment", "return-value", "override", "call-arg", "no-any-return", "operator", "dict-item", "import-not-found"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
    { module = "docs.*", ignore_errors = true },
]

[tool.uv.sources.quadkit]
workspace = true

[tool.uv.sources.quadkit-contracts]
workspace = true

[tool.uv.sources.quadkit-testing]
workspace = true

[tool.pytest.ini_options]
addopts = ["--cov=quadkit.ai.mcp", "--cov-report=html", "--cov-report=term", "--cov-fail-under=83"]
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/quadkit",
]

[project.entry-points."quadkit.cli.contributors"]
mcp = "quadkit.ai.mcp.cli.contributor:McpCliContributor"
