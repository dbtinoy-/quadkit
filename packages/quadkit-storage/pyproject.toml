[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "quadkit-storage"
version = "0.0.43"
description = "Unified blob storage abstraction for Quadkit Framework - S3, GCS, Azure Blob, and local filesystem"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "storage",
    "blob",
    "s3",
    "gcs",
    "azure",
    "filesystem",
    "async",
    "framework",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "quadkit>=0.0.2",
    "quadkit-contracts>=0.0.2",
    "python-magic>=0.4.27",
    "aiofiles>=23.0.0",
    "jinja2>=3.1.0",
]
authors = [
    { name = "Quadkit Framework Team", email = "team@quadkit.dev" },
]
maintainers = [
    { name = "Quadkit Framework Team", email = "team@quadkit.dev" },
]

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
aws = [
    "aiobotocore>=2.0.0",
    "types-aiobotocore[s3]>=2.0.0",
]
gcp = [
    "gcloud-aio-storage>=9.0.0",
]
azure = [
    "azure-storage-blob>=12.0.0",
]
test = [
    "quadkit-testing>=0.0.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.4",
    "mypy>=1.0.0",
]
all = [
    "aiobotocore>=2.0.0",
    "types-aiobotocore[s3]>=2.0.0",
    "gcloud-aio-storage>=9.0.0",
    "azure-storage-blob>=12.0.0",
    "quadkit-testing>=0.0.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.urls]
Homepage = "https://dbtinoy-.github.io/quadkit"
Repository = "https://github.com/dbtinoy-/quadkit"
Documentation = "https://dbtinoy-.github.io/quadkit"
Issues = "https://github.com/dbtinoy-/quadkit/issues"
Changelog = "https://github.com/dbtinoy-/quadkit/blob/main/CHANGELOG.md"

[project.entry-points."quadkit.cli.contributors"]
storage = "quadkit.storage.cli.contributor:StorageCliContributor"

[project.entry-points."quadkit.modules"]
StorageModule = "quadkit.storage.module:StorageModule"

[project.entry-points."quadkit.config"]
storage = "quadkit.storage.config:StorageConfig"

[dependency-groups]
dev = [
    "black>=23.0.0",
    "ruff>=0.16.4",
    "mypy>=1.0.0",
]
test = [
    "quadkit-testing>=0.0.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
    "PLE0604",  # `*` used in `__all__` without `__all__` defined
    "PLE0605",  # `*` import from non-module
    "PYI056",  # calling `.append()` and `.extend()` in `__init_subclass__`
    "TRY004",  # prefer TypeError instead of plain Exception
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["quadkit"]
force-sort-within-sections = true

[tool.mypy]
ignore_missing_imports = true
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
    { module = "docs.*", ignore_errors = true },
]

[tool.uv.sources.quadkit]
workspace = true

[tool.uv.sources.quadkit-testing]
workspace = true

[tool.uv.sources.quadkit-contracts]
workspace = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = ["--cov=quadkit.storage", "--cov-report=html", "--cov-report=term", "--cov-fail-under=75",]
testpaths = ["tests"]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_minio: marks tests that require a live MinIO/S3 connection",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/quadkit",
]
