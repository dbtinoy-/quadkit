<!DOCTYPE html>
<html>
<head>
    <title>{{ title }} - Swagger UI</title>
    <link rel="stylesheet" type="text/css" href="{{ swagger_css_url or 'https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui.css' }}" />
    <style>
        html { box-sizing: border-box; overflow-y: scroll; }
        *, *:before, *:after { box-sizing: inherit; }
        body { margin: 0; background: #fafafa; }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="{{ swagger_js_url or 'https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-bundle.js' }}"></script>
    <script src="https://unpkg.com/swagger-ui-dist@5.10.3/swagger-ui-standalone-preset.js"></script>
    <script>
    window.onload = function() {
        SwaggerUIBundle({
            url: '{{ openapi_url }}',
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            plugins: [SwaggerUIBundle.plugins.DownloadUrl],
            layout: "StandaloneLayout"
        });
    };
    </script>
</body>
</html>
