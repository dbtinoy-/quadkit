[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quadkit-notification"
version = "0.0.50"
description = "SMS, push, and email notification delivery with Named DI multi-backend support for the Quadkit Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["quadkit", "notification", "alerts", "email", "push", "framework", "async", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
authors = [{ name = "Quadkit Framework Team", email = "team@quadkit.dev" }]
maintainers = [{ name = "Quadkit Framework Team", email = "team@quadkit.dev" }]
dependencies = [
    "quadkit-contracts>=0.0.50",
    "quadkit>=0.0.50",
    "aiofiles>=23.0",
    "aiohttp>=3.9",
    "pywebpush>=2.3.0",
    "starlette>=0.28.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://dbtinoy-.github.io/quadkit"
Repository = "https://github.com/dbtinoy-/quadkit"
Documentation = "https://dbtinoy-.github.io/quadkit"
Issues = "https://github.com/dbtinoy-/quadkit/issues"
Changelog = "https://github.com/dbtinoy-/quadkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
sendgrid = ["sendgrid>=6.0"]
twilio = ["twilio>=8.0"]
apns = ["httpx[http2]>=0.27.0", "PyJWT>=2.8.0", "cryptography>=42.0.0"]
web-push = [
    "pywebpush>=1.14.0",
]
slack = ["httpx>=0.27.0", "slack-sdk>=3.0"]
whatsapp = ["httpx>=0.27.0"]
test = [
    "quadkit-auth>=0.0.50",
    "quadkit-sql>=0.0.50",
    "quadkit-testing>=0.0.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]
dev = ["ruff>=0.16.4", "mypy>=1.0.0"]

[dependency-groups]
dev = ["ruff>=0.16.4", "mypy>=1.0.0"]
test = [
    "quadkit-auth>=0.0.50",
    "quadkit-sql>=0.0.50",
    "quadkit-testing>=0.0.2",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
]

[project.entry-points."quadkit.providers"]
mailer = "quadkit.notification.di.mailer_provider:MailerProvider"
inbox = "quadkit.notification.di.inbox_provider:InboxProvider"

[project.entry-points."quadkit.cli.contributors"]
notification = "quadkit.notification.cli.contributor:NotificationCliContributor"

[tool.hatch.build.targets.wheel]
packages = ["src/quadkit"]

[tool.uv.sources]
quadkit = { workspace = true }
quadkit-contracts = { workspace = true }
quadkit-testing = { workspace = true }

[tool.mypy]
python_version = "3.11"
namespace_packages = true
explicit_package_bases = true
mypy_path = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict = true
show_error_codes = true
overrides = [
    { module = "tests.*", ignore_errors = true },
]

[tool.ruff]
extend = "../../pyproject.toml"
line-length = 88
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["quadkit"]
force-sort-within-sections = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=quadkit.notification",
    "--cov-report=term",
    "--cov-report=html",
    "--cov-fail-under=85",
]
markers = [
    "integration: mark a test as an integration test",
    "scenario: marks cross-package scenario integration tests",
    "requires_smtp: marks tests that require an SMTP server",
]
